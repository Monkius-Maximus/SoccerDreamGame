#
# THIS FILE EXISTS FOR THE GODOT EDITOR AND ITS NAME IS NOT OPTIONAL.
#
# Godot 4's .NET integration derives both paths from [dotnet] project/assembly_name
# in project.godot, and looks for them beside it:
#
#     game/<assembly_name>.sln      -> game/SoccerDreamGame.sln
#     game/<assembly_name>.csproj   -> game/SoccerDreamGame.csproj
#
# If either is missing under that exact name, the editor concludes the project has
# no C# at all: the Build button has nothing to build, no assembly is produced, every
# script silently detaches from its node, and the game opens as a black window with
# nothing in the log naming the cause.
#
# It also lists the two core projects so a build FROM THE EDITOR compiles the whole
# dependency chain, not just the Godot layer.
#
# The repository root has its own SoccerDreamGame.sln — same name, different job: that
# one also carries the xUnit test project and is what CI and `dotnet` on the command
# line use. The editor must never build the tests, hence two files.
#
